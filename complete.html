<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Flow — Completed</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="fa-solid fa-diagram-project"></i></div>
      Task <span class="accent">Flow</span>
    </div>
    <div class="sidebar-section">
      <span class="section-label">Menu</span>
      <a href="dashboard.html" class="nav-link"><span class="nav-icon"><i class="fa-solid fa-house"></i></span> Dashboard</a>
      <a href="stats.html"     class="nav-link"><span class="nav-icon"><i class="fa-solid fa-chart-bar"></i></span> Stats</a>
      <input type="checkbox" class="tasks-toggle-input" id="tasksToggle" checked />
      <label for="tasksToggle" class="nav-link tasks-toggle-label active">
        <span class="nav-icon"><i class="fa-solid fa-list-check"></i></span> Tasks
        <i class="fa-solid fa-chevron-down chevron"></i>
      </label>
      <div class="submenu">
        <a href="pending.html"  class="submenu-link"><i class="fa-regular fa-clock"></i> Pending <span id="pending-badge" style="display:none;background:var(--medium);color:#fff;padding:1px 7px;border-radius:20px;font-size:11px;margin-left:auto">0</span></a>
        <a href="complete.html" class="submenu-link active"><i class="fa-solid fa-circle-check"></i> Completed</a>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="cats-header">
        <span class="section-label" style="padding:0">Categories</span>
        <button class="add-cat-btn" onclick="openCatModal()"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div class="cat-list" id="sidebar-cats"></div>
    </div>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="sb-avatar">U</div>
        <div><div class="user-name" id="sb-name">User</div><div class="user-email" id="sb-email">user@email.com</div></div>
      </div>
      <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div class="topbar">
      <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-logo"><i class="fa-solid fa-diagram-project"></i> Task <span class="accent">Flow</span></div>
    </div>

    <main class="main-content">
      <div class="page-header">
        <div class="page-header-left">
          <h1><i class="fa-solid fa-circle-check"></i> Completed Tasks</h1>
          <p>Tasks you have successfully finished</p>
        </div>
        <span class="page-badge" id="task-count-badge"><i class="fa-solid fa-trophy"></i> 0 completed</span>
      </div>

      <div class="action-bar">
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input class="search-input" type="text" id="search-input" placeholder="Search completed tasks..." oninput="applyFilters()" />
        </div>
      </div>

      <div class="filter-bar">
        <span class="filter-label"><i class="fa-solid fa-filter"></i> Filter:</span>
        <button class="filter-btn active" onclick="setPriFilter('all',this)"><i class="fa-solid fa-layer-group"></i> All Completed</button>
        <div class="filter-divider"></div>
        <button class="filter-btn" onclick="setPriFilter('high',this)">🔴 High</button>
        <button class="filter-btn" onclick="setPriFilter('medium',this)">🟡 Medium</button>
        <button class="filter-btn" onclick="setPriFilter('low',this)">🟢 Low</button>
      </div>

      <div class="tasks-grid" id="tasks-list"></div>
    </main>
  </div>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="task-modal" onclick="if(event.target===this)closeTaskModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="task-modal-title">Edit Task</span>
      <button class="modal-close" onclick="closeTaskModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-input-group"><label>Title *</label><input class="modal-input" type="text" id="t-title" placeholder="Task title" /></div>
    <div class="modal-input-group"><label>Description</label><textarea class="modal-input" id="t-desc" rows="3" placeholder="Optional details..."></textarea></div>
    <div class="modal-grid">
      <div class="modal-input-group"><label>Due Date</label><input class="modal-input" type="date" id="t-due" /></div>
      <div class="modal-input-group"><label>Priority</label>
        <select class="modal-input" id="t-priority"><option value="low">🟢 Low</option><option value="medium" selected>🟡 Medium</option><option value="high">🔴 High</option></select>
      </div>
    </div>
    <div class="modal-input-group"><label>Category</label><select class="modal-input" id="t-category"></select></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeTaskModal()">Cancel</button>
      <button class="btn-submit" id="t-submit" onclick="submitTask()">Save Changes</button>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-overlay" id="del-modal" onclick="if(event.target===this)closeDeleteModal()">
  <div class="modal modal-sm">
    <div class="modal-header"><span class="modal-title">Delete Task</span><button class="modal-close" onclick="closeDeleteModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <p style="color:var(--text-light);font-size:14px;margin-bottom:8px">Are you sure you want to delete this task?</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn-submit btn-submit-danger" onclick="confirmDelete()"><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
  </div>
</div>

<!-- Category Modal -->
<div class="modal-overlay" id="cat-modal" onclick="if(event.target===this)closeCatModal()">
  <div class="modal modal-sm">
    <div class="modal-header"><span class="modal-title">New Category</span><button class="modal-close" onclick="closeCatModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-input-group"><label>Name</label><input class="modal-input" type="text" id="cat-name" placeholder="e.g. Finance" /></div>
    <div class="modal-input-group"><label>Color</label><input type="color" id="cat-color" value="#4A90E2" style="width:60px;height:36px;border:none;background:none;cursor:pointer" /></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCatModal()">Cancel</button>
      <button class="btn-submit" onclick="submitCat()">Add Category</button>
    </div>
  </div>
</div>

<div class="toast-container"></div>
<script src="js/app.js"></script>
<script>
  let _priFilter = 'all';
  function setPriFilter(p, btn) { _priFilter = p; setActiveFilter(btn); applyFilters(); }

  async function applyFilters() {
    const query = (document.getElementById('search-input')?.value || '').toLowerCase();
    let tasks = await getTasks();
    tasks = tasks.filter(t => t.status === 'complete');
    if (_priFilter !== 'all') tasks = tasks.filter(t => t.priority === _priFilter);
    if (query) tasks = tasks.filter(t => t.title.toLowerCase().includes(query) || (t.description||'').toLowerCase().includes(query));
    renderTaskList(tasks);
  }

  async function renderTaskList(tasks) {
    const cats = await getCats();
    const badge = document.getElementById('task-count-badge');
    if (badge) badge.innerHTML = `<i class="fa-solid fa-trophy"></i> ${tasks.length} completed`;
    const el = document.getElementById('tasks-list');
    if (!tasks.length) {
      el.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i><h3>No completed tasks yet</h3><p>Tasks you complete will appear here.</p><a href="pending.html" style="display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--primary);color:#fff;border-radius:var(--radius-md);font-weight:600;font-size:14px"><i class="fa-solid fa-arrow-left"></i> Go to Pending</a></div>`;
      return;
    }
    el.innerHTML = tasks.map(t => buildTaskCard(t, cats, { showRestore: true, showCheck: false })).join('');
  }

  async function renderPage() { applyFilters(); }
  renderPage();
</script>
</body>
</html>
