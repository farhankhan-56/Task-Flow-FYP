<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Flow — Forgot password</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-wrapper">

  <div class="auth-left">
    <div class="auth-circle-sm" style="width:220px;height:220px;top:8%;right:6%"></div>
    <div class="auth-circle-sm" style="width:110px;height:110px;bottom:18%;left:12%"></div>
    <div class="auth-brand">
      <div class="auth-brand-icon"><i class="fa-solid fa-diagram-project"></i></div>
      <span class="auth-brand-name">Task Flow</span>
    </div>
    <div class="auth-slogan">
      <h2>Set a<br><span class="highlight">new password</span></h2>
      <p>Enter the email registered on Task Flow—if we find it, you can choose a new password.</p>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-form-box">
      <h2>Forgot password</h2>

      <div id="fp-step-email">
        <div class="form-group">
          <label for="fp-email"><i class="fa-solid fa-envelope"></i> Email</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input class="form-input" type="email" id="fp-email" placeholder="Your registered email" autocomplete="username" required />
          </div>
        </div>
        <button type="button" class="auth-btn" onclick="fpCheckEmail()">
          <i class="fa-solid fa-arrow-right"></i> Continue
        </button>
      </div>

      <div id="fp-step-password" hidden>
        <p id="fp-label-email" style="color:var(--muted,#666);font-size:0.9rem;margin:0 0 1rem"></p>
        <div class="form-group">
          <label for="fp-otp"><i class="fa-solid fa-shield"></i> Verification code</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-shield input-icon"></i>
            <input class="form-input" type="text" id="fp-otp" placeholder="Enter the 6-digit code" autocomplete="one-time-code" maxlength="6" required />
          </div>
        </div>
        <div class="form-group">
          <label for="fp-pass"><i class="fa-solid fa-lock"></i> New password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input class="form-input" type="password" id="fp-pass" placeholder="Min. 6 characters" autocomplete="new-password" required />
          </div>
        </div>
        <div class="form-group">
          <label for="fp-confirm"><i class="fa-solid fa-shield-halved"></i> Confirm password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-shield-halved input-icon"></i>
            <input class="form-input" type="password" id="fp-confirm" placeholder="Repeat password" autocomplete="new-password" required />
          </div>
        </div>
        <button type="button" class="auth-btn" onclick="fpSavePassword()">
          <i class="fa-solid fa-floppy-disk"></i> Save new password
        </button>
        <button type="button" class="auth-btn" style="margin-top:0.65rem;background:transparent;color:var(--text,#222);border:1px solid rgba(0,0,0,.12)" onclick="fpBackToEmail()">
          <i class="fa-solid fa-arrow-left"></i> Use a different email
        </button>
      </div>

      <div class="auth-footer-link">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to log in</a>
      </div>
    </div>
  </div>
</div>

<div class="toast-container"></div>
<script src="js/app.js"></script>
<script>
  function fpValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  }

  async function fpCheckEmail() {
    const email = document.getElementById('fp-email')?.value.trim() ?? '';
    if (!email) { showToast('Please enter your email', 'error'); return; }
    if (!fpValidEmail(email)) { showToast('Enter a valid email address', 'error'); return; }
    try {
      const res = await apiFetch('/auth/forgot-password/check-email', {
        method: 'POST',
        body: { email }
      });
      if (!res.exists) {
        showToast('No account found with this email.', 'error');
        return;
      }
      document.getElementById('fp-step-email').hidden = true;
      document.getElementById('fp-step-password').hidden = false;
      document.getElementById('fp-label-email').textContent = `Enter the code sent to ${email}`;
      document.getElementById('fp-otp')?.focus();
    } catch (err) {
      showToast(err.error || 'Could not check email', 'error');
    }
  }

  function fpBackToEmail() {
    document.getElementById('fp-step-password').hidden = true;
    document.getElementById('fp-step-email').hidden = false;
    document.getElementById('fp-otp').value = '';
    document.getElementById('fp-pass').value = '';
    document.getElementById('fp-confirm').value = '';
  }

  async function fpSavePassword() {
    const email = document.getElementById('fp-email')?.value.trim() ?? '';
    const otp = document.getElementById('fp-otp')?.value.trim() ?? '';
    const p1 = document.getElementById('fp-pass')?.value ?? '';
    const p2 = document.getElementById('fp-confirm')?.value ?? '';
    if (!email) { showToast('Missing email.', 'error'); return; }
    if (!otp) { showToast('Enter the 6-digit code sent to your email', 'error'); return; }
    if (!p1 || !p2) { showToast('Fill in both password fields', 'error'); return; }
    if (p1.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }
    if (p1 !== p2) { showToast('Passwords do not match', 'error'); return; }
    try {
      await apiFetch('/auth/forgot-password/reset', {
        method: 'POST',
        body: { email, otp, password: p1 }
      });
      showToast('Password saved! Redirecting to login…', 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 900);
    } catch (err) {
      showToast(err.error || 'Could not save password', 'error');
    }
  }

  document.getElementById('fp-email')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') fpCheckEmail();
  });
  document.getElementById('fp-otp')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') fpSavePassword();
  });
</script>
</body>
</html>
